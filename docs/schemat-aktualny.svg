<rect x="1170" y="1070" width="580" height="270" rx="10" class="box"/><rect x="1170" y="1070" width="580" height="39" rx="10" class="band"/>
<text x="1185" y="1096" class="head">POMIAR NAPIĘCIA PAKIETU · PRZYSZŁOŚĆ</text>
<text x="1190" y="1140" class="label">Planowany pomiar BAT+ przez osobny dzielnik i ADC.</text>
<text x="1190" y="1175" class="note">Nie jest podłączony ani obsługiwany w kodzie.</text>
<text x="1190" y="1210" class="small">Pin, wartości, ochrona i kalibracja: do ustalenia.</text>
<text x="40" y="1390" class="note">UWAGI: obciążenie i połączenia zasilania potwierdzić pomiarami; unikać jednoczesnego zasilania USB i 5 V bez sprawdzenia płytki.</text>
<text x="40" y="1420" class="note">Wspólne GND: silnik, BMS, przetwornica, ESP i serwa. Linie sygnałowe 5 V nie łączą się bezpośrednio z GPIO 3,3 V.</text>
<text x="40" y="1450" class="small">Praca silnika i zmiana kierunku: przetestowane; FOUT nie jest skalibrowanym RPM.</text>
