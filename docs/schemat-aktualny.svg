ext x="515" y="995" class="small">C</text><text x="515" y="1070" class="small">E</text><rect x="570" y="989" width="66" height="22" class="res"/><text x="580" y="983" class="small">330 Ω</text><path d="M636 1000 H710" class="wire"/><text x="720" y="1005" class="net">MOTOR_DIR</text><text x="55" y="1100" class="small">Sprawdzić kolejność nóżek E/B/C tranzystora; GPIO HIGH ściąga linię silnika do masy.</text>
