[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
board_build.partitions = min_spiffs.csv
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
monitor_filters = time
monitor_dtr = 0
monitor_rts = 0

[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = esp32-cam-rc.local
